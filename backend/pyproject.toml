[project]
name = "cineloca-backend"
version = "0.1.0"
description = "부산 씨네로케 API·배치"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pgvector>=0.3,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "tzdata>=2024.1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "import-linter>=2.1,<3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: 실제 PostgreSQL(TEST_DATABASE_URL)이 필요한 테스트"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

# 4장 계층 계약: api → services·pipeline → support → data
[[tool.importlinter.contracts]]
name = "계층: api → services·pipeline → support → data"
type = "layers"
layers = ["app.api", "app.services | app.pipeline", "app.support", "app.data"]

# services 아래 모듈끼리는 서로 import하지 않는다
[[tool.importlinter.contracts]]
name = "services 모듈 독립"
type = "independence"
modules = ["app.services.*"]

# batch는 api·services를 import하지 않는다(ADR-012)
[[tool.importlinter.contracts]]
name = "batch는 api·services 금지"
type = "forbidden"
source_modules = ["app.batch"]
forbidden_modules = ["app.api", "app.services"]

# 외부 호출(httpx)은 data/adapters와 data/ai_gateway에서만
[[tool.importlinter.contracts]]
name = "httpx는 adapters·ai_gateway에서만"
type = "forbidden"
source_modules = ["app.api", "app.services", "app.pipeline", "app.support", "app.batch", "app.data.repositories"]
forbidden_modules = ["httpx"]
allow_indirect_imports = true
