# AI 게이트웨이 설정(build-plan 6장). 모델명·제한 시간·공급자 순서는 이 파일에만 둔다(AGENTS.md).
deadline_s: 7.5
reserve_s: 0.3
providers:
  gemini:
    model: gemini-3.5-flash-lite      # 대안 gemini-3.1-flash-lite. 환경변수 GEMINI_MODEL이 있으면 그 값
    thinking_level: minimal
    min_timeout_s: 1.0
    rpm: 10                           # AI Studio의 무료 한도 값으로 교체(확인 필요)
    daily_limit: 1000                 # 〃
  ollama:
    model: "qwen3:8b"
    enabled: false                    # OLLAMA_LLM_URL이 있을 때만 켠다
    min_timeout_s: 2.0
    rpm: 30
    daily_limit: 100000
    think: false
    keep_alive: 30m
    options: {num_ctx: 8192, temperature: 0.2}
embedder: {model: bge-m3, dim: 1024, timeout_s: 1.5}
tasks:
  extract_query:        {chain: [gemini, ollama], cap_s: 3.0, prompt: v1, schema: conditions.v1}
  summarize_results:    {chain: [gemini, ollama], cap_s: 4.0, prompt: v1, schema: sentences.v1}
  structure_preference: {chain: [gemini, ollama], cap_s: 3.0, prompt: v1, schema: preference.v1}
  course_intro:         {chain: [gemini, ollama], cap_s: 4.0, prompt: v1, schema: course_intro.v1}
  work_intro:           {chain: [gemini, ollama], cap_s: 6.0, prompt: v1, schema: sentences.v1}
  suggest_tags:         {chain: [ollama, gemini], cap_s: 20, prompt: v1, schema: tags.v1}
  judge_match:          {chain: [ollama, gemini], cap_s: 20, prompt: v1, schema: match.v1}
breaker: {fails: 5, open_s: 60}
cache_ttl_h: 24
usage_warn_ratio: 0.7
