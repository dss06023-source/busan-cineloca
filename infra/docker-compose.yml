# 개발·시연 공용 구성(build-plan 3장). 저장소 루트에서:
#   cp infra/.env.example infra/.env   # 값 채우기
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml --profile batch run --rm batch   # 동기화(WP-07 이후)
name: cineloca

services:
  web:
    build:
      context: ../frontend
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped

  api:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/cineloca
      OLLAMA_URL: http://embed:11434
      LOG_DIR: /srv/logs
    volumes:
      - api-logs:/srv/logs
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: cineloca
      # 이미지 기본 로캘(en_US.utf8) 유지. C 로캘이면 pg_trgm이 한글 트라이그램을 못 뽑는다(build-plan 7장)
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cineloca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  embed:
    image: ollama/ollama:0.12.6
    # 처음 한 번 bge-m3(약 1.2GB)를 내려받는다. CPU로 돈다.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull bge-m3 && wait"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  batch:
    build: ../backend
    profiles: [batch]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/cineloca
      OLLAMA_URL: http://embed:11434
    # WP-07이 python -m app.batch로 바꾼다
    command: ["python", "-c", "print('batch: WP-07에서 구현 예정')"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  db-data:
  api-logs:
  ollama:
