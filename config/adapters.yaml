# 외부 데이터 어댑터 설정(build-plan 9장, SDD CD-05). 주소·제한 시간·하루 한도는 이 파일에만 둔다.
# daily_limit은 기관이 정한 하루 호출 한도이고, 어댑터는 그 80%(quota_ratio)에서 멈춘다(NFR-018).
quota_ratio: 0.8
retries: 3          # 같은 요청을 최대 몇 번 보낼지(5xx·연결 실패·시간 초과만 다시 보냄)
backoff_s: 1.0      # 재시도 대기: backoff_s × 2^(n-1)
adapters:
  kobis:
    source_id: DATA-05
    base_url: https://www.kobis.or.kr/kobisopenapi/webservice/rest/movie
    timeout_s: 5.0
    page_size: 10
    daily_limit: 3000   # KOBIS 오픈 API 키당 하루 3,000건(확인 필요)
  tourapi:
    source_id: DATA-10
    base_url: https://apis.data.go.kr/B551011/KorService2
    timeout_s: 10.0
    page_size: 100
    daily_limit: 1000   # 개발계정 서비스별 하루 1,000건(확인 필요)
  bfc_movie:
    source_id: DATA-01
    base_url: https://apis.data.go.kr/6260000/BfcMovieBusanService
    timeout_s: 15.0
    page_size: 1000
    daily_limit: 10000  # 개발계정 하루 10,000건(확인 필요)
  cinemap:
    source_id: DATA-02
    base_url: https://apis.data.go.kr/6260000/CineMapService
    timeout_s: 15.0
    page_size: 1000
    daily_limit: 10000  # 〃
  station:
    source_id: DATA-08
    base_url: https://apis.data.go.kr/B551542/stationInfo
    timeout_s: 15.0
    page_size: 500
    daily_limit: 10000  # 〃
  juso_search:
    source_id: DATA-06
    base_url: https://business.juso.go.kr/addrlink
    timeout_s: 10.0
    page_size: 10
    daily_limit: 100000  # 가이드에 하루 한도 없음. 짧은 시간 과다 요청은 E0007(확인 필요)
  juso_coord:
    source_id: DATA-06
    base_url: https://business.juso.go.kr/addrlink
    timeout_s: 10.0
    page_size: 1
    daily_limit: 100000  # 〃
