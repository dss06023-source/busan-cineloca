# web(8080): SPA 제공 + /api를 api:8000으로 전달. 같은 출처라 CORS 설정이 필요 없다.
# 접근 로그에 쿼리 문자열과 IP를 남기지 않는다(NFR-003). conf.d 파일은 http 블록 안에 포함된다.
log_format noquery '$time_iso8601 $request_method $uri $status $request_time';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  access_log /var/log/nginx/access.log noquery;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri /index.html;
  }
}
